name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build the Angular app for the repository sub-path (source files untouched)
        run: npx ng build --configuration development --base-href /ClaraBernadou_5_NumDev_042024/
      - name: Add the simulated API and the API documentation
        run: |
          cp ../demo/demo-api.js dist/yoga/
          cp -r ../api-docs dist/yoga/api-docs
          sed -i 's#</head>#<script src="demo-api.js"></script></head>#' dist/yoga/index.html
          test "$(grep -c 'demo-api.js' dist/yoga/index.html)" -eq 1
          cp dist/yoga/index.html dist/yoga/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist/yoga
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
